name: deploy
# Construit Gospel System à partir :
#  - des données de ce dépôt (data/songs, data/setlists, data/members.json, data/audio)
#  - du code commun du dépôt Zovy-Tononkira (édition « gospel »)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Chaque nuit : récupère les évolutions du code commun
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: content }
      - uses: actions/checkout@v5
        with:
          repository: Hasina-Zazahkel/Zovy-Tononkira
          ref: main
          path: app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          EDITION: gospel
          DATA_DIR: ${{ github.workspace }}/content/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
